<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Fountain Transfer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="lib/qrlink.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--muted:#626a75;--acc:#0b6bcb;--ok:#1a8f3c;--bad:#c62828;--line:#dde1e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121417;--fg:#e9ecef;--card:#1c1f24;--muted:#9aa3ad;--acc:#4ea1ff;--ok:#4cc36f;--bad:#ff6b6b;--line:#30353c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--fg:#e9ecef;--card:#1c1f24;--muted:#9aa3ad;--acc:#4ea1ff;--ok:#4cc36f;--bad:#ff6b6b;--line:#30353c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.sub a{color:var(--acc)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font-weight:600}
button,a.dl{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.tabs button.active{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:10px 0}
label{color:var(--muted);font-size:12px;display:block}
input,select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input[type=number]{width:96px}
input[type=file]{width:100%}
#qrWrap{background:#fff;border-radius:8px;margin:10px auto;width:min(92vw,560px)}
#qr{display:block;width:100%;height:auto;aspect-ratio:1;background:#fff;image-rendering:pixelated}
#qrWrap:fullscreen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;border-radius:0}
#qrWrap:fullscreen #qr{width:auto;height:100vh}
video{width:100%;max-height:50vh;border-radius:10px;background:#000;object-fit:cover;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;font-size:12px;color:var(--muted)}
.stats div{background:var(--bg);border-radius:8px;padding:6px 8px}
.stats b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.muted{color:var(--muted);font-size:13px}
.ok{color:var(--ok);font-weight:600} .bad{color:var(--bad)}
a.dl{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;margin-top:10px}
.hidden{display:none}
#preview img{max-width:100%;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>QR Fountain Transfer</h1>
<div class="sub">One screen broadcasts, any number of phones receive, in any order, even if they miss frames. <a href="multi/">Multiplex lab: colors, tiles and layers</a> · <a href="quiz/">Quiz mode</a></div>

<div class="tabs">
  <button id="tabSend" class="active">Send</button>
  <button id="tabRecv">Receive</button>
</div>

<section id="send">
  <div class="card">
    <label for="file">1. Choose a file</label>
    <input type="file" id="file">
    <div class="row">
      <span><label for="blk">Block size (bytes)</label><input type="number" id="blk" value="400" min="40" max="1200"></span>
      <span><label for="fps">Frames / s</label><input type="number" id="fps" value="12" min="1" max="30"></span>
      <span><label for="ecc">QR error correction</label>
        <select id="ecc"><option selected>L</option><option>M</option><option>Q</option></select></span>
      <span><label for="scrH">Screen height (m)</label><input type="number" id="scrH" value="1.5" min="0.1" max="6" step="0.1"></span>
    </div>
    <div class="row">
      <button class="primary" id="btnConvert" disabled>2. Convert to QR series</button>
      <button id="btnPlay" disabled>Play</button>
      <button id="btnFull" disabled>Fullscreen</button>
    </div>
    <div id="sendInfo" class="muted">Smaller blocks are readable from farther away but slower.</div>
  </div>
  <div id="qrWrap"><canvas id="qr" width="760" height="760"></canvas></div>
  <div class="card stats" id="sendStats"></div>
</section>

<section id="recv" class="hidden">
  <div class="card">
    <div class="row" style="margin-top:0">
      <button class="primary" id="btnCam">Open camera &amp; receive</button>
      <button id="btnCamStop" disabled>Stop camera</button>
      <button id="btnReset">Reset</button>
    </div>
    <label id="zoomWrap" class="hidden" for="zoom">Zoom <span id="zoomVal"></span><input type="range" id="zoom" style="width:100%"></label>
    <div class="muted" id="decoderName">Point the camera at the sender's screen.</div>
  </div>
  <video id="video" playsinline muted></video>
  <div class="card">
    <div id="recvTitle" class="muted">Waiting for a transfer…</div>
    <div class="bar"><i id="rxBar"></i></div>
    <div class="stats" id="recvStats"></div>
    <div id="result"></div>
    <div id="preview"></div>
  </div>
</section>
</main>

<script>
/* Uses lib/qrlink.js (protocol v3: base45 alphanumeric QR, binary header, LT fountain code
   with Gaussian-elimination decoding, refresh-locked frame timing). Prefix "F4". */
const $=id=>document.getElementById(id), PREFIX='F4', Q=QRLink;
function fmtBytes(n){return n<1024?n.toFixed(0)+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';}
function fmtTime(s){s=Math.max(1,Math.round(s));return s<60?s+' s':Math.floor(s/60)+' min '+(s%60?s%60+' s':'');}
function stat(l,v){return `<div>${l}<b>${v}</b></div>`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

$('tabSend').onclick=()=>{$('tabSend').classList.add('active');$('tabRecv').classList.remove('active');$('send').classList.remove('hidden');$('recv').classList.add('hidden');stopCam();};
$('tabRecv').onclick=()=>{$('tabRecv').classList.add('active');$('tabSend').classList.remove('active');$('recv').classList.remove('hidden');$('send').classList.add('hidden');pause();};

/* ======================= SENDER ======================= */
let file=null,enc=null,bc=null,n=0,wakeLock=null;
$('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  pause(); enc=null; $('btnPlay').disabled=true; $('btnFull').disabled=true;
  file={name:f.name,mime:f.type||'application/octet-stream',bytes:new Uint8Array(await f.arrayBuffer())};
  $('btnConvert').disabled=false;
  $('sendInfo').innerHTML=`${esc(f.name)} · ${fmtBytes(f.size)}`;
};
$('btnConvert').onclick=async()=>{
  pause();
  enc=await Q.makeEncoder(file.bytes,{B:+$('blk').value,prefix:PREFIX,meta:{n:file.name,m:file.mime}});
  try{ n=Q.makeQR(enc.largestText(),$('ecc').value).getModuleCount(); Q.drawQR($('qr'),enc.infoText(),$('ecc').value); }
  catch(e){ enc=null; $('sendInfo').innerHTML='<span class="bad">The block size is too big for one QR code. Lower it.</span>'; return; }
  $('btnPlay').disabled=false; $('btnFull').disabled=false;
  $('sendInfo').innerHTML=`Ready: ${esc(file.name)} in <b>${enc.K}</b> blocks of ${enc.B} B. Press Play.`;
  stats();
};
function stats(){
  if(!enc) return;
  const fps=bc&&bc.fps?bc.fps:+$('fps').value, dataFps=fps*(1-1/enc.every), H=+$('scrH').value||1.5;
  const dMax=H/(n+8)*1280/(4*1.3);
  $('sendStats').innerHTML=stat('Blocks K',enc.K)+stat('QR size',`${n}×${n}`)+stat('Frame rate',fps.toFixed(1)+' fps')
    +stat('Data rate',fmtBytes(enc.B*dataFps)+'/s')+stat('Time at no loss',fmtTime(enc.K*1.03/dataFps))
    +stat('Readable to about',dMax.toFixed(1)+' m')+stat('Frames shown',bc?bc.frames:0);
}
async function play(){
  if(!enc) return;
  bc=Q.broadcast($('qr'),{fps:Math.min(30,Math.max(1,+$('fps').value)),ecc:$('ecc').value,next:()=>enc.next(),onFrame:s=>{ if(s.frames%6===0) stats(); }});
  $('btnPlay').textContent='Pause';
  try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}
}
function pause(){ if(bc){bc.stop();bc=null;} $('btnPlay').textContent='Play'; try{wakeLock?.release();}catch(e){} wakeLock=null; }
$('btnPlay').onclick=()=>bc?pause():play();
$('btnFull').onclick=()=>{ try{ const r=$('qrWrap').requestFullscreen?.(); r&&r.catch(()=>{}); }catch(e){} };
['fps','ecc','scrH'].forEach(id=>$(id).addEventListener('change',()=>{ if(!enc) return; if(id==='ecc'){ try{ n=Q.makeQR(enc.largestText(),$('ecc').value).getModuleCount(); }catch(e){} } stats(); if(bc&&id!=='scrH'){ pause(); play(); } }));
$('blk').addEventListener('change',()=>{ if(enc){ pause(); $('btnConvert').click(); } });

/* ======================= RECEIVER ======================= */
let cam=null,scanning=false,sessions=new Map(),done=null;
function resetRx(){ sessions.clear(); done=null; $('recvTitle').textContent='Waiting for a transfer…'; $('recvStats').innerHTML=''; $('result').innerHTML=''; $('preview').innerHTML=''; $('rxBar').style.width='0'; }
$('btnReset').onclick=resetRx;
async function startCam(){
  try{ cam=await Q.openCamera(); }
  catch(e){ $('decoderName').innerHTML='<span class="bad">The camera could not start.</span> Open this page over HTTPS and allow camera access.'; return; }
  const v=$('video'); v.srcObject=cam.stream; try{ await v.play(); }catch(e){}
  const caps=cam.track.getCapabilities?cam.track.getCapabilities():{};
  if(caps.zoom&&caps.zoom.max>caps.zoom.min){ const z=$('zoom'); z.min=caps.zoom.min; z.max=Math.min(caps.zoom.max,8); z.step=caps.zoom.step||0.1; z.value=caps.zoom.min; $('zoomVal').textContent=(+z.value).toFixed(1)+'×'; $('zoomWrap').classList.remove('hidden'); }
  $('decoderName').textContent='Decoder: '+(cam.detector?'built-in':'JavaScript')+'. Point the camera at the sender screen.';
  scanning=true; $('btnCam').disabled=true; $('btnCamStop').disabled=false;
  Q.eachVideoFrame(v,async()=>{ for(const t of await Q.readFrame(v,cam.detector)) onText(t); },()=>scanning);
}
function stopCam(){ scanning=false; cam?.stream.getTracks().forEach(t=>t.stop()); cam=null; $('btnCam').disabled=false; $('btnCamStop').disabled=true; $('zoomWrap').classList.add('hidden'); }
$('btnCam').onclick=startCam; $('btnCamStop').onclick=stopCam;
$('zoom').oninput=()=>{ $('zoomVal').textContent=(+$('zoom').value).toFixed(1)+'×'; cam?.track.applyConstraints({advanced:[{zoom:+$('zoom').value}]}).catch(()=>{}); };

function onText(text){
  const p=Q.parse(text,PREFIX); if(!p) return;
  if(done&&done.id===p.id) return;
  let s=sessions.get(p.id); if(!s){ s=new Q.Decoder(p.id); sessions.set(p.id,s); }
  if(s.finishing) return;
  s.add(p);
  if(s.ready){ s.finishing=true; finish(s); }
  ui(s);
}
function ui(s){
  if(!s.K) return;
  const t=(performance.now()-s.t0)/1000;
  $('recvTitle').innerHTML=(s.meta?`<b>${esc(s.meta.n||'File')}</b>`:'Incoming file')+' · '+fmtBytes(s.size);
  $('rxBar').style.width=(100*s.recovered/s.K)+'%';
  $('recvStats').innerHTML=stat('Blocks',s.recovered+' / '+s.K)+stat('Packets',s.seen.size)+stat('Overhead',s.seen.size?((s.seen.size/s.K-1)*100).toFixed(0)+' %':'–')+stat('Time',t.toFixed(1)+' s');
}
async function finish(s){
  const t=(performance.now()-s.t0)/1000, data=await s.bytes();
  if(!data){ sessions.delete(s.id); $('result').innerHTML='<p class="bad">The file was damaged in transfer. Receiving it again…</p>'; return; }
  done={id:s.id}; ui(s);
  const name=s.meta.n||'received-file', mime=s.meta.m||'application/octet-stream', url=URL.createObjectURL(new Blob([data],{type:mime}));
  $('result').innerHTML=`<p class="ok">File received and verified.</p>
    <div class="stats">${stat('Total time',t.toFixed(1)+' s')}${stat('Goodput',fmtBytes(data.length/t)+'/s')}${stat('Packets used',s.seen.size+' for '+s.K)}</div>
    <a class="dl" href="${url}" download="${esc(name)}">Download ${esc(name)}</a>`;
  if(mime.startsWith('image/')) $('preview').innerHTML=`<img src="${url}" alt="Received image">`;
  navigator.vibrate?.(200); stopCam();
}
</script>
</body>
</html>
