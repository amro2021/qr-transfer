# Builds the Android app (Capacitor shell around the pages) and publishes it at
# https://amro2021.github.io/qr-transfer/download/qr-lab.apk
name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'lib/**', 'index.html', 'multi/**', 'quiz/**', 'chat/**', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install packages and bundle the pages
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          node prepare.mjs
      - name: Create the Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
          cp android-overrides/MainActivity.java android/app/src/main/java/com/amro2021/qrlab/MainActivity.java
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          add='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          if 'android.permission.CAMERA' not in s: s=s.replace('</manifest>', add+'</manifest>')
          open(p,'w').write(s)
          PY
          grep -n "CAMERA\|INTERNET" android/app/src/main/AndroidManifest.xml
      - name: Build the APK
        working-directory: app/android
        run: |
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
      - name: Publish the APK
        run: |
          mkdir -p download
          cp app/android/app/build/outputs/apk/debug/app-debug.apk download/qr-lab.apk
          echo "Built $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}" > download/version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/qr-lab.apk download/version.txt
          git commit -m "Build Android app (${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
