# Runs the analysis whenever a phone saves a new dataset into data/,
# and commits the figures, tables and results page to results/.
name: Analyse QR lab datasets
on:
  push:
    branches: [main]
    paths: ['data/**.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analyse
  cancel-in-progress: false
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy matplotlib
      - run: python analysis/analyze_qr_lab.py data/*.zip -o results
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update analysis results"
          git pull --rebase origin main
          git push origin HEAD:main
